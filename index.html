<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu site</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <nav>
        <p>Home</p>
        <p>Detalhes</p>
    </nav>
    <h1>computação gráfica</h1>
    <h4>aula do professor Laion Black</h4>
    <br>
    <br>
    <br>
    <p id="texto-post">Bem vindo a o meu blog</p>
    <form id="meu-form">
        <div>
          <label for="email">Digite seu email</label>
          <input type="email" id="email" required>
        </div>
        <div>
          <label for="message">Mande uma message:</label>
          <textarea id="message" required></textarea>
        </div>
        </label>
        <button type="submit">Send</button>
      </form>

    <script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "🤖 A IA está pensando...";

        // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
        const response = await fetch('https://andriellybecker.app.n8n.cloud/webhook/09021d42-2260-43de-9feb-7186a28546f0', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        // Pede para o navegador ler a resposta como texto puro
        const text = await response.text();

        // Substitui o texto pela resposta da IA!
        textoPost.innerHTML = marked.parse(text);
      });
    </script>

</body>
</html>
